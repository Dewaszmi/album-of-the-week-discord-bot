<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AOTW Queue</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div id="login">
    <h1>AOTW Queue</h1>
    <p>Enter the admin token.</p>
    <input type="password" id="token" placeholder="Token" autocomplete="current-password">
    <button id="login-btn">Log in</button>
    <p id="login-error" class="error hidden"></p>
  </div>

  <div id="app" class="hidden">
    <header>
      <h1>Album of the Week</h1>
      <button id="logout-btn" class="secondary">Log out</button>
    </header>

    <form id="search-form">
      <input type="text" id="query" placeholder="Search Last.fm or paste album URL" required>
      <select id="target">
        <option value="main">Normal</option>
        <option value="bonus">Bonus</option>
      </select>
      <input type="text" id="suggester" placeholder="Suggested by (optional)">
      <button type="submit">Search</button>
    </form>
    <p id="search-status" class="muted"></p>
    <ul id="results"></ul>

    <section>
      <h2>Normal <span id="main-count" class="badge">0</span></h2>
      <ul id="main"></ul>
    </section>
    <section>
      <h2>Bonus <span id="bonus-count" class="badge">0</span></h2>
      <ul id="bonus"></ul>
    </section>
  </div>

  <script src="/static/app.js"></script>
</body>
</html>
